<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>灵动嘻哈外传 · 本地版</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script src="./ruffle/ruffle.js" defer></script>
  <script src="./app.js" type="module"></script>
</head>
<body>
  <main>
    <header><div><span class="eyebrow">MHHF / CLASSIC ARCHIVE</span><h1>灵动嘻哈外传 <span>集成版</span></h1></div><span class="badge">键盘 / 触屏</span></header>
    <section class="player-card" aria-label="游戏播放器">
      <div id="game-console">
        <div id="stage" tabindex="0" aria-label="游戏画面，点击后使用键盘操作"><div id="placeholder"><p>熟悉的江湖，重新出发。</p><p class="muted">点击下方「启动游戏」载入原版内容。</p></div></div>
        <div id="touch-controls" class="controls-disabled" aria-label="触屏操作">
          <div id="joystick-zone" aria-label="移动摇杆"><span class="joystick-label">移动</span></div>
          <div class="action-buttons"><button data-key="k" class="jump-button" disabled>跳跃<span>K</span></button><button data-key="j" class="attack-button" disabled>攻击<span>J</span></button></div>
        </div>
      </div>
      <div class="toolbar"><button id="start">启动游戏</button><button data-key="i" class="pause-button" disabled>暂停</button><button id="restart" disabled>重新启动</button><label class="combo-label">判定 <select id="combo-mode"><option value="assist" selected>必杀宽松</option><option value="relaxed">普通连击宽松</option><option value="original">原版</option></select></label><button id="fullscreen" disabled>全屏</button><button id="sound" disabled>静音</button><span id="status" role="status">等待启动</span></div>
    </section>
    <section class="help"><p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 <i></i><kbd>J</kbd> 攻击 <i></i><kbd>K</kbd> 跳跃 <i></i><kbd>I</kbd> 游戏暂停</p><p class="muted">手机建议横屏：左手摇杆移动，右手攻击 / 跳跃，可同时按住。菜单直接点击游戏画面。触控对应原版默认按键，游戏内改键后请恢复默认。</p><p id="input-status" class="muted" aria-live="off">触控：已松开</p></section>
    <details><summary>运行信息</summary><pre id="diagnostics">Ruffle 0.7.1 · 所有游戏资源由本机提供。</pre><ul id="resources"></ul></details>
    <footer>原作：灵动游戏 · 本地保存版 · 浏览器无需 Flash 插件</footer>
  </main>
</body>
</html>
